# VitalisRegions v1.0.0 - Purpur/Paper 1.21.11
general:
  prefix: "&8[&aRG&8] "
  # golden axe wand (does NOT conflict with WorldEdit wooden axe)
  wand: GOLDEN_AXE

limits:
  # max regions per player (perm rg.unlimited = endless)
  max-per-player: 100
  # worlds where creating is denied (empty = all allowed)
  blocked-worlds: []

economy:
  # price for /rg create (0 = free). Charged via Vault if present.
  claim-price: 0.0
  symbol: "$"

protection:
  # default flags for new regions
  default-pvp: false
  default-explosions: false

gui:
  title-info: "&8Регион &a{name}"
  sounds: true
