# VitalisRegions - Purpur/Paper 1.21.11
# Цвета: legacy '&' ИЛИ MiniMessage <gradient:#5DFF6E:#00E5FF>текст</gradient>,
# <rainbow>, <red>, <gray> и т.д. Внутри MiniMessage коды '&' не работают!
general:
  prefix: '<gradient:#FFD76A:#7AD9FF>[RG]</gradient> <gray>'
  # golden axe wand (does NOT conflict with WorldEdit wooden axe)
  wand: GOLDEN_AXE

limits:
  # max regions per player (perm rg.unlimited = endless)
  max-per-player: 100
  # worlds where creating is denied (empty = all allowed)
  blocked-worlds: []

economy:
  # price for /area create (0 = free). Charged via Vault if present.
  claim-price: 0.0
  symbol: "$"

protection:
  # default flags for new regions (green = on, red = off in GUI)
  default-pvp: false
  default-explosions: false
  default-fire-spread: false
  default-mechanisms: true
  default-homes: true

gui:
  title-info: '<gradient:#5DFF6E:#00E5FF>Регион {name}</gradient>'
  sounds: true

# Heaven style: gradient colors used in chat menus
theme:
  from: "#FFD76A"
  to: "#7AD9FF"
  # actionbar title when entering your region
  enter-title: true

# Actionbar toast on crossing a region border.
# %region% and %owner% are replaced. First entry per session is silent.
greet:
  enabled: true
  enter: '&#FFD76A◆ &f%region% &7· &f%owner%'
  leave: '&7Дикая местность'

# Particle outline of region borders. Toggle per player via the
# [Границы] chat button in /area or /area border [name].
border:
  enabled: true
  # ticks between redraws (lower = smoother, more packets)
  interval: 10
  # blocks between particles on an edge (1 = every block)
  step: 1
  # DUST (colored) or any Particle name: END_ROD, FLAME, VILLAGER_HAPPY...
  particle: DUST
  color: "#7AD9FF"
  size: 0.9
  # only redraw when the viewer is within this many blocks of the region
  max-distance: 64
  # hard cap of particles per region per redraw (edge step grows to fit)
  max-particles: 400
