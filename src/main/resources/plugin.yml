name: VitalisRegions
version: ${version}
main: com.vitalis.rg.Regions
api-version: "1.21"
author: Vitalis
description: Light regions for Purpur/Paper 1.21.11 - select, create, GUI members, protection.
depend: []
softdepend: [Vault, Essentials, WorldGuard, PlaceholderAPI]
commands:
  area:
    description: "Regions - everything in chat buttons. Commands pos1, pos2, remove."
    usage: /area [pos1|pos2|remove|kick|border]
    aliases: [region, regions, rg]
permissions:
  area.use:
    description: Use /area
    default: true
  area.create:
    description: Create regions (admins only)
    default: op
  area.unlimited:
    description: Bypass region count limits
    default: op
  area.bypass:
    description: Ignore region protection
    default: op
  area.admin:
    description: Delete other players regions
    default: op
