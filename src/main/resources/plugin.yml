name: VitalisRegions
version: ${version}
main: com.vitalis.rg.Regions
api-version: "1.21"
author: Vitalis
description: Light regions for Purpur/Paper 1.21.11 - select, create, GUI members, protection.
depend: []
softdepend: [Vault, Essentials, WorldGuard]
commands:
  rg:
    description: Regions - select points, create, manage. All settings in GUI.
    usage: /rg [pos1|pos2|wand|create|delete|list|info]
    aliases: [region, regions]
permissions:
  rg.use:
    description: Use /rg
    default: true
  rg.create:
    description: Create regions
    default: true
  rg.unlimited:
    description: Bypass region count and size limits
    default: op
  rg.bypass:
    description: Ignore region protection
    default: op
  rg.admin:
    description: Delete other players regions
    default: op
