name: VitalisRegions
version: ${version}
main: com.vitalis.rg.Regions
api-version: "1.21"
author: Vitalis
description: Light regions for Purpur/Paper 1.21.11 - select, create, GUI members, protection.
depend: []
softdepend: [Vault, Essentials, WorldGuard]
commands:
  area:
    description: Regions - select points, create, manage. All settings in GUI.
    usage: /area [pos1|pos2|wand|create|delete|list|info|reload]
    aliases: [region, regions, rg]
permissions:
  area.use:
    description: Use /area
    default: true
  area.create:
    description: Create regions
    default: true
  area.unlimited:
    description: Bypass region count limits
    default: op
  area.bypass:
    description: Ignore region protection
    default: op
  area.admin:
    description: Delete other players regions
    default: op
